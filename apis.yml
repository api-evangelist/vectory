name: VectorY
description: >-
  VectorY Therapeutics is a clinical-stage biotechnology company developing
  novel genetic medicines for neurodegenerative diseases using its proprietary
  Vectorized Antibody Platform, which combines AAV-based gene delivery with
  antibody engineering to express therapeutic antibodies directly in the central
  nervous system. Its pipeline targets amyotrophic lateral sclerosis (ALS) with
  VTx-002 and VTx-001 and Huntington's disease with VTx-003. The company was
  surfaced as a portfolio company of Insight Partners and added to the API
  Evangelist network. As a therapeutics research organization, VectorY publishes
  a corporate website, pipeline, scientific publications, news, and careers, but
  operates no public developer API, documentation portal, or programmatic
  interface surface.
